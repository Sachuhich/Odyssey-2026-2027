<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СПО "Одиссея" (2026-2027)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="main-nav">
        <button class="nav-btn active" onclick="switchPage('calendar')">Календарь</button>
        <button class="nav-btn" onclick="switchPage('tierlist')">Рейтинг</button>
    </nav>

    <section id="calendar" class="page active">
        <h2 class="graffiti-title">Календарь событий</h2>
        
        <div class="season-grid-wrapper">
            <div id="month-tabs" class="season-grid"></div>
        </div>

        <div class="weekdays-grid">
            <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>

        <div id="calendar-grid" class="calendar-grid"></div>

        <div class="legend-inline-format">
            <span class="legend-item"><span class="color-dot odyssey-dot"></span> — Одиссея</span>
            <span class="legend-item"><span class="color-dot shso-dot"></span> — ШСО</span>
            <span class="legend-item"><span class="color-dot spbso-dot"></span> — СПбСО</span>
            <span class="legend-item"><span class="color-dot youth-dot"></span> — Молодёжный</span>
        </div>

    </section>

    <section id="tierlist" class="page">
        <h2 class="graffiti-title">Рейтинг Костиксов</h2>
        
        <div id="rating-list" class="rating-container"></div>

        <div class="legend-inline-format rating-footer-panel">
            <a href="https://vk.ru/dmitrieena" target="_blank" class="footer-name">Фадеева Даша</a>
            <a href="https://vk.ru/k0st3k" target="_blank" class="footer-name">Дербенев Костя</a>
            <a href="https://vk.ru/kkvakushkaa" target="_blank" class="footer-name">Дмитриева Настя</a>
            <a href="https://vk.ru/pnp2009" target="_blank" class="footer-name">Погорелов Платон</a>
            <a href="https://vk.ru/elizaodms" target="_blank" class="footer-name">Ворожцова Елизавета</a>
        </div>
    </section>

    <script type="module" src="script.js"></script>
</body>
</html>
